version: 2
models:
  - name: dim_company
    description: "Company dimension (distinct employers)."
    columns:
      - name: company_sk
        description: "Surrogate key (hash of company_name)."
        tests: [unique, not_null]
      - name: company_name
        tests: [not_null]
  - name: dim_location
    description: "Location dimension (city / state / country)."
    columns:
      - name: location_sk
        tests: [unique, not_null]
  - name: dim_skill
    description: "Skill dimension (distinct tagged skills)."
    columns:
      - name: skill_sk
        tests: [unique, not_null]
      - name: skill_name
        tests: [not_null]
  - name: dim_date
    description: "Date dimension (2023-01-01 to 2027-01-01)."
    columns:
      - name: date_key
        description: "YYYYMMDD integer surrogate."
        tests: [unique, not_null]
  - name: dim_job
    description: "SCD Type 2 job dimension (current + history); is_current marks the live version."
    columns:
      - name: job_version_sk
        description: "Surrogate per job version (id + valid_from)."
        tests: [unique, not_null]
      - name: job_sk
        tests:
          - relationships:
              arguments:
                to: ref('fact_jobs')
                field: job_sk
  - name: fact_jobs
    description: "Fact table: one row per active, non-duplicate job posting."
    columns:
      - name: job_sk
        tests: [unique, not_null]
      - name: job_id
        tests: [unique, not_null]
      - name: company_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_sk
      - name: location_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_sk
      - name: posted_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['adzuna', 'jobicy', 'wellfound', 'naukri', 'hirist', 'instahyre', 'indeed']
              config:
                severity: warn
  - name: bridge_job_skill
    description: "Resolves the job-to-skill many-to-many."
    columns:
      - name: job_sk
        tests:
          - relationships:
              arguments:
                to: ref('fact_jobs')
                field: job_sk
      - name: skill_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_skill')
                field: skill_sk
  - name: mart_skill_demand
    description: "Job count per skill (dashboard + heatmap source)."
    columns:
      - name: skill_name
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_skill_demand_by_city
    description: "Skill demand by city (heatmap source)."
    columns:
      - name: city
        tests: [not_null]
      - name: skill_name
        tests: [not_null]
  - name: mart_salary_by_city
    description: "Salary aggregates by city and currency (currencies kept separate)."
    columns:
      - name: city
        tests: [not_null]
  - name: mart_top_companies
    description: "Companies ranked by number of open postings."
    columns:
      - name: company_name
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_hiring_velocity
    description: "Postings per day (hiring velocity)."
    columns:
      - name: posted_date
        tests: [unique, not_null]
      - name: jobs_posted
        tests: [not_null]
  - name: mart_jobs_by_source
    description: "Job volume by source."
    columns:
      - name: source
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: dim_experience_band
    description: "Experience-band dimension with display order."
    columns:
      - name: experience_band
        tests: [unique, not_null]
  - name: dim_role
    description: "Role-bucket dimension with display order."
    columns:
      - name: role
        tests: [unique, not_null]
  - name: mart_salary_by_experience
    description: "Salary aggregates by required-experience band (currencies separate)."
    columns:
      - name: experience_band
        tests: [not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_salary_by_city_experience
    description: "Salary by city x experience band (currencies separate)."
    columns:
      - name: city
        tests: [not_null]
  - name: mart_salary_by_role
    description: "Salary aggregates by role bucket (currencies separate)."
    columns:
      - name: role
        tests: [not_null]
  - name: mart_jobs_by_role
    description: "Posting counts and salary coverage by role bucket."
    columns:
      - name: role
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_salary_by_role_experience
    description: "Salary by role bucket x experience band (currencies separate)."
    columns:
      - name: role
        tests: [not_null]
  - name: mart_skill_trend
    description: "Monthly demand per skill."
    columns:
      - name: skill_name
        tests: [not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_skill_salary_premium
    description: "Average INR salary for postings mentioning each skill (>=5 postings)."
    columns:
      - name: skill_name
        tests: [unique, not_null]
  - name: mart_skill_cooccurrence
    description: "Skill-pair co-occurrence across postings (>=10 co-mentions)."
    columns:
      - name: skill_a
        tests: [not_null]
      - name: skill_b
        tests: [not_null]
      - name: co_count
        tests: [not_null]
  - name: mart_emerging_skills
    description: "Skills rising in share: recent 30-day mentions vs prior 30-day."
    columns:
      - name: skill_name
        tests: [unique, not_null]
  - name: mart_salary_model_input
    description: "Materialized salary-regression input: features, skill_count, salary midpoint."
    columns:
      - name: id
        tests: [unique, not_null]
  - name: mart_jobs_by_state
    description: "Posting counts and salary coverage by state."
    columns:
      - name: state
        tests: [unique, not_null]
  - name: mart_salary_by_state
    description: "INR salary aggregates by state."
    columns:
      - name: state
        tests: [unique, not_null]
  - name: mart_remote_vs_onsite
    description: "Remote/worldwide vs located postings: counts and INR salary."
    columns:
      - name: work_mode
        tests: [unique, not_null]
  - name: mart_posting_trend
    description: "Daily posting volume (active postings by posted date)."
    columns:
      - name: posted_date
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_job_freshness
    description: "Posting freshness buckets by age in days."
    columns:
      - name: freshness_bucket
        tests: [unique, not_null]
  - name: mart_company_hiring_trend
    description: "Monthly posting volume per company."
    columns:
      - name: company
        tests: [not_null]
  - name: mart_dedup_summary
    description: "Deduplication summary by source: duplicate rows vs total."
    columns:
      - name: source
        tests: [unique, not_null]
  - name: mart_source_coverage
    description: "Per-source coverage: active postings, salary fill rate, latest posting."
    columns:
      - name: source
        tests: [unique, not_null]
  - name: mart_role_skill_matrix
    description: "Skill demand per role bucket: postings per (role, skill)."
    columns:
      - name: role
        tests: [not_null]
      - name: skill_name
        tests: [not_null]
