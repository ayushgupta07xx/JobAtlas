version: 2
models:
  - name: dim_company
    description: "Company dimension (distinct employers)."
    columns:
      - name: company_sk
        description: "Surrogate key (hash of company_name)."
        tests: [unique, not_null]
      - name: company_name
        tests: [not_null]
  - name: dim_location
    description: "Location dimension (city / state / country)."
    columns:
      - name: location_sk
        tests: [unique, not_null]
  - name: dim_skill
    description: "Skill dimension (distinct tagged skills)."
    columns:
      - name: skill_sk
        tests: [unique, not_null]
      - name: skill_name
        tests: [not_null]
  - name: dim_date
    description: "Date dimension (2023-01-01 to 2027-01-01)."
    columns:
      - name: date_key
        description: "YYYYMMDD integer surrogate."
        tests: [unique, not_null]
  - name: dim_job
    description: "SCD Type 2 job dimension (current + history); is_current marks the live version."
    columns:
      - name: job_version_sk
        description: "Surrogate per job version (id + valid_from)."
        tests: [unique, not_null]
      - name: job_sk
        tests:
          - relationships:
              arguments:
                to: ref('fact_jobs')
                field: job_sk
  - name: fact_jobs
    description: "Fact table: one row per active, non-duplicate job posting."
    columns:
      - name: job_sk
        tests: [unique, not_null]
      - name: job_id
        tests: [unique, not_null]
      - name: company_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_sk
      - name: location_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_sk
      - name: posted_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['adzuna', 'jobicy', 'wellfound', 'naukri', 'hirist', 'instahyre', 'indeed']
              config:
                severity: warn
  - name: bridge_job_skill
    description: "Resolves the job-to-skill many-to-many."
    columns:
      - name: job_sk
        tests:
          - relationships:
              arguments:
                to: ref('fact_jobs')
                field: job_sk
      - name: skill_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_skill')
                field: skill_sk
  - name: mart_skill_demand
    description: "Job count per skill (dashboard + heatmap source)."
    columns:
      - name: skill_name
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_skill_demand_by_city
    description: "Skill demand by city (heatmap source)."
    columns:
      - name: city
        tests: [not_null]
      - name: skill_name
        tests: [not_null]
  - name: mart_salary_by_city
    description: "Salary aggregates by city and currency (currencies kept separate)."
    columns:
      - name: city
        tests: [not_null]
  - name: mart_top_companies
    description: "Companies ranked by number of open postings."
    columns:
      - name: company_name
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
  - name: mart_hiring_velocity
    description: "Postings per day (hiring velocity)."
    columns:
      - name: posted_date
        tests: [unique, not_null]
      - name: jobs_posted
        tests: [not_null]
  - name: mart_jobs_by_source
    description: "Job volume by source."
    columns:
      - name: source
        tests: [unique, not_null]
      - name: job_count
        tests: [not_null]
