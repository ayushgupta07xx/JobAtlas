name: 'jobatlas'
version: '1.0.0'
config-version: 2
profile: 'jobatlas'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  jobatlas:
    staging:
      +materialized: view
      +schema: dbt_staging
    intermediate:
      +materialized: view
      +schema: dbt_intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  jobatlas:
    +schema: seeds
    jobs_seed:
      +column_types:
        id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        raw_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        source_job_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        # snowflake-text-types
        source: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        source_url: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        title: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        company: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        city: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        state: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        country: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        currency: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        description: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        content_hash: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        salary_min: numeric
        salary_max: numeric
        posted_date: date
        is_active: boolean
        is_duplicate: boolean
        dedup_group_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        scraped_at: timestamp
        created_at: timestamp
        updated_at: timestamp
    job_skills_seed:
      +column_types:
        job_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        skill_name: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
