name: 'jobatlas'
version: '1.0.0'
config-version: 2
profile: 'jobatlas'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  jobatlas:
    staging:
      +materialized: view
      +schema: dbt_staging
    intermediate:
      +materialized: view
      +schema: dbt_intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  jobatlas:
    +schema: seeds
    jobs_seed:
      +column_types:
        id: bigint
        raw_id: bigint
        source_job_id: varchar
        salary_min: numeric
        salary_max: numeric
        posted_date: date
        is_active: boolean
        is_duplicate: boolean
        dedup_group_id: bigint
        scraped_at: timestamp
        created_at: timestamp
        updated_at: timestamp
    job_skills_seed:
      +column_types:
        job_id: bigint
