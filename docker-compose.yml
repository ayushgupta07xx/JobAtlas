name: jobatlas

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/airflow/Dockerfile
  image: jobatlas/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow_db
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '30'
    _PIP_ADDITIONAL_REQUIREMENTS: ''
    # JobAtlas: live code path + service-name DB conns (container env wins; .env override=False)
    PYTHONPATH: /opt/jobatlas/src:/opt/jobatlas
    DATABASE_URL: postgresql+psycopg://jobatlas:changeme-local-only@postgres:5432/jobatlas
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: jobatlas
    # Airflow Connections + Variables (auto-loaded from env)
    AIRFLOW_CONN_JOBATLAS_PG: postgres://jobatlas:changeme-local-only@postgres:5432/jobatlas
    AIRFLOW_CONN_JOBATLAS_MONGO: mongo://mongo:27017/jobatlas
    AIRFLOW_VAR_JOBATLAS_SOURCES: '["adzuna", "jobicy"]'
    AIRFLOW_VAR_DEDUP_JACCARD: '0.85'
    AIRFLOW_VAR_EMBED_BATCH_SIZE: '32'
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ./orchestration/airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/jobatlas/src
    - ./apps:/opt/jobatlas/apps
    - ./scrapers:/opt/jobatlas/scrapers
    - ./.env:/opt/jobatlas/.env:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobatlas-postgres
    environment:
      POSTGRES_USER: jobatlas
      POSTGRES_PASSWORD: changeme-local-only
      POSTGRES_DB: jobatlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobatlas -d jobatlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  mongo:
    image: mongo:7
    container_name: jobatlas-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: jobatlas-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  connect:
    image: debezium/connect:2.7.3.Final
    container_name: jobatlas-connect
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: jobatlas-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

  minio:
    image: minio/minio:latest
    container_name: jobatlas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: jobatlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/jobatlas-raw || true &&
      echo 'MinIO bucket jobatlas-raw ready.'
      "
    restart: "no"

  airflow-init:
    <<: *airflow-common
    container_name: jobatlas-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: jobatlas-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    container_name: jobatlas-airflow-webserver
    command: webserver
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redpanda_data:
  minio_data:
  airflow_logs:
