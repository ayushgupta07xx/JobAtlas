[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"
[project]
name = "jobatlas"
version = "0.0.1"
description = "Unified search across India's tech job boards."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ayush Gupta" }]
dependencies = [
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
]
[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "sqlfluff>=3.1",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/jobatlas"]
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scrapers", "apps", "orchestration", "streaming"]
extend-exclude = ["warehouse/dbt_project/target", "warehouse/dbt_project/dbt_packages"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
max_line_length = 120
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
