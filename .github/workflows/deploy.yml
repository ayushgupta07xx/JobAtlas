name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fly:
    name: deploy api to fly.io
    runs-on: ubuntu-latest
    # Skips (green) until you set repo variable DEPLOY_ENABLED=true + secret FLY_API_TOKEN.
    # Vercel deploys via its native GitHub integration, so no Vercel step is needed here.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: apps/api
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
