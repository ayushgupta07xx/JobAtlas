name: scheduled-scrape

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily
  workflow_dispatch:

permissions:
  contents: write # to commit refreshed dashboard snapshots

jobs:
  refresh:
    name: daily refresh
    runs-on: ubuntu-latest
    # Skips (green) until you set repo variable SCRAPE_ENABLED=true + the secrets below.
    # API sources only (Adzuna/Jobicy) — Playwright scrapers stay local per the scraping policy.
    if: ${{ vars.SCRAPE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Scrape + normalize (API sources)
        run: python -m scrapers.run --sources adzuna,jobicy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Refresh dashboard snapshots (ADR-0014)
        run: python scripts/export_dashboard_data.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboards/jobs_extract.csv docs/dashboards/skills_by_city.csv
          git diff --cached --quiet || git commit -m "data: refresh dashboard snapshots [skip ci]"
          git push
