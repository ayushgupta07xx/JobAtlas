name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: lint · type-check · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Pytest
        run: pytest -q || [ "$?" -eq 5 ]

  sql:
    name: sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: SQLFluff lint
        run: sqlfluff lint warehouse/dbt_project/models --dialect postgres || true

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "dbt-postgres>=1.7,<2.0"
      - name: Write CI dbt profile
        run: |
          PROFILE=$(grep -E '^profile:' warehouse/dbt_project/dbt_project.yml | head -1 | sed -E "s/^profile:[[:space:]]*//; s/[\"']//g")
          mkdir -p ~/.dbt
          {
            echo "$PROFILE:"
            echo "  target: ci"
            echo "  outputs:"
            echo "    ci:"
            echo "      type: postgres"
            echo "      host: localhost"
            echo "      port: 5432"
            echo "      user: ci"
            echo "      password: ci"
            echo "      dbname: ci"
            echo "      schema: public"
            echo "      threads: 4"
          } > ~/.dbt/profiles.yml
      - name: dbt deps + parse
        working-directory: warehouse/dbt_project
        run: |
          dbt deps
          dbt parse --profiles-dir "$HOME/.dbt" --target ci

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      - name: Format check
        run: terraform fmt -check -recursive infra/terraform
      - name: Init + validate (dev env)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

  security:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
