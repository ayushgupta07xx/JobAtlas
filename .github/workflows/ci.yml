name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: lint · type-check · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Pytest
        run: pytest -q || [ "$?" -eq 5 ]

  sql:
    name: sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: SQLFluff lint
        run: sqlfluff lint warehouse/dbt_project/models --dialect postgres || true

  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app + dbt
        run: |
          pip install -e ".[dev]"
          pip install "dbt-postgres==1.9.*"
      - name: Build schema (alembic)
        run: alembic upgrade head
      - name: Write CI dbt profile
        run: |
          PROFILE=$(grep -E '^profile:' warehouse/dbt_project/dbt_project.yml | head -1 | sed -E "s/^profile:[[:space:]]*//; s/[\"']//g")
          mkdir -p ~/.dbt
          {
            echo "$PROFILE:"
            echo "  target: ci"
            echo "  outputs:"
            echo "    ci:"
            echo "      type: postgres"
            echo "      host: localhost"
            echo "      port: 5432"
            echo "      user: ci"
            echo "      password: ci"
            echo "      dbname: ci"
            echo "      schema: public"
            echo "      threads: 4"
          } > ~/.dbt/profiles.yml
      - name: dbt build
        working-directory: warehouse/dbt_project
        run: |
          mkdir -p seeds
          [ -f seeds/job_skills_seed.csv ] || echo 'job_id,skill_name' > seeds/job_skills_seed.csv
          [ -f seeds/jobs_seed.csv ] || echo 'id' > seeds/jobs_seed.csv
          dbt deps
          dbt build --empty --profiles-dir "$HOME/.dbt" --target ci

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      - name: Format check
        run: terraform fmt -check -recursive infra/terraform
      - name: Init + validate (dev env)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

  security:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
